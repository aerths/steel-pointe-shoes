<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Pointe Shoes</title>
    <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
    <header>
        <section class="head">
            <div class="logo">
                <div class="logo_img">
                    <img src="./assets/images/image 4.svg" alt="logo">
                </div>
                <div class="logo_text">
                    <p>
                        Стальной пуант
                    </p>
                </div>
            </div>
            <div class="navigation">
                <a href="">Направление</a>
                <a href="">Расписание</a>
                <a href="">Преподаватели</a>
                <a href="">Цены</a>
            </div>
            <div class="trial_lesson">
                <button class="red_btn">
                    Пробное занятие
                </button>
            </div>
        </section>
    </header>

    <main>
        <section class="main_page">
            <div class="main_page_text">
                <div class="main_page_name">
                    <p>хуёк МУЖСКАЯ БАЛЕТНАЯ СТУДИЯ</p>
                </div>
                <div class="main_page_title">
                    <h1>
                        БАЛЕТ, КОТОРЫЙ ДЕЛАЕТ СИЛЬНЕЕ
                    </h1>
                </div>
                <div class="main_page_subtitle">
                    <h2>
                        Мужская балетная студия для начинающих
                        и продолжающих. Сила, дисциплина, пластика и сцена.
                    </h2>
                </div>
                <div class="main_page_btn">
                    <div>
                        <button class="red_btn">
                            Записаться на пробное занятие
                        </button>
                    </div>
                    <div>
                        <button class="white_border_btn">
                            Смотреть расписание
                        </button>
                    </div>
                </div>
                <div>
                    <p>-----------</p>
                </div>
                <div class="studio_data">
                    <div class="block_data_studio">
                        <div class="number_data_studio">
                            <h1>12</h1>
                            <p class="main_page_name">направлений</p>
                        </div>
                    </div>
                    <div class="block_data_studio">
                        <div class="number_data_studio">
                            <h1>8</h1>
                            <p class="main_page_name">преподавателей</p>
                        </div>
                    </div>
                    <div class="block_data_studio">
                        <div class="number_data_studio">
                            <h1>500+</h1>
                            <p class="main_page_name">учеников</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="main_page_img">
                <img src="./assets/images/Танцор в прыжке.svg" alt="">
            </div>
        </section>
    </main>
</body>
</html>
